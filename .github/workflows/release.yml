name: Build and publish Linux packages

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}
  RELEASE_TAG: v0.1.${{ github.run_number }}

# Every push keeps its own run and version. A global concurrency group would
# discard intermediate pending pushes when several builds arrive together.
jobs:
  build:
    name: glibc 2.28 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUNTIME_BUILD_IMAGE: rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
      SDK_CACHE_ROOT: ${{ runner.temp }}/dayline-sdk
      DAYLINE_BUILD_CONTAINER: dayline-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Check out the pushed source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore the architecture-specific runtime SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SDK_CACHE_ROOT }}/prefix
          key: runtime-sdk-rocky8-9794037624aaa621-${{ matrix.arch }}-${{ hashFiles('scripts/build-runtime-sdk.sh') }}

      - name: Start the pinned native glibc 2.28 build container
        run: |
          [[ "$(dpkg --print-architecture)" == '${{ matrix.arch }}' ]]
          mkdir -p "$SDK_CACHE_ROOT/prefix"
          docker run --detach --name "$DAYLINE_BUILD_CONTAINER" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source" \
            --mount "type=bind,src=$SDK_CACHE_ROOT,dst=/sdk" \
            "$RUNTIME_BUILD_IMAGE" sleep infinity

      - name: Build or verify the private Qt 6.4 runtime SDK
        run: |
          # No update proxy secret reaches this process or the cached SDK.
          docker exec "$DAYLINE_BUILD_CONTAINER" bash /source/scripts/build-runtime-sdk.sh
          [[ -f "$SDK_CACHE_ROOT/prefix/share/dayline-runtime/complete" ]]

      - name: Save the completed SDK before building the application
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SDK_CACHE_ROOT }}/prefix
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Configure the exact release version
        env:
          DAYLINE_UPDATE_PROXY_BASE: ${{ secrets.DAYLINE_UPDATE_PROXY_BASE }}
        run: |
          if [[ -z "$DAYLINE_UPDATE_PROXY_BASE" ]]; then
            echo '::error::Configure the DAYLINE_UPDATE_PROXY_BASE repository secret before publishing an update-enabled package.'
            exit 1
          fi
          python3 -c 'import os; print("::add-mask::" + os.environ["DAYLINE_UPDATE_PROXY_BASE"].encode("utf-8").hex())'
          # Forward the secret only during the application build. Docker's
          # container configuration and the SDK cache never receive it.
          docker exec --interactive --env RELEASE_VERSION --env DAYLINE_UPDATE_PROXY_BASE \
            "$DAYLINE_BUILD_CONTAINER" bash -Eeuo pipefail <<'SH'
          set +u
          source /opt/rh/gcc-toolset-12/enable
          set -u
          export PATH="/sdk/prefix/bin:$PATH"
          export PKG_CONFIG_PATH=/sdk/prefix/lib/pkgconfig
          export LD_LIBRARY_PATH="/sdk/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S /source -B /source/build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=/sdk/prefix -DOPENSSL_ROOT_DIR=/sdk/prefix \
            -DDAYLINE_BUNDLE_RUNTIME=ON -DDAYLINE_RUNTIME_PREFIX=/sdk/prefix \
            -DDAYLINE_VERSION="$RELEASE_VERSION"
          SH

      - name: Build and install the complete private runtime
        env:
          DAYLINE_UPDATE_PROXY_BASE: ${{ secrets.DAYLINE_UPDATE_PROXY_BASE }}
        run: |
          # Keep the value available if CMake automatically reconfigures.
          docker exec --interactive --env DAYLINE_UPDATE_PROXY_BASE \
            "$DAYLINE_BUILD_CONTAINER" bash -Eeuo pipefail <<'SH'
          set +u
          source /opt/rh/gcc-toolset-12/enable
          set -u
          export PATH="/sdk/prefix/bin:$PATH"
          export PKG_CONFIG_PATH=/sdk/prefix/lib/pkgconfig
          export LD_LIBRARY_PATH="/sdk/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake --build /source/build-release --parallel "$(nproc)"
          DESTDIR=/source/build-release/package-root cmake --install /source/build-release
          SH

      - name: Package and verify the Debian metadata and executable
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils dpkg-dev xz-utils
          sudo chown -R "$(id -u):$(id -g)" build-release/package-root
          bash scripts/package-runtime-deb.sh \
            build-release/package-root "$RELEASE_VERSION" "$PACKAGE_ARCH" dist
          package="dist/dayline_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"
          [[ -f "$package" ]]
          [[ "$(dpkg-deb --field "$package" Package)" == dayline ]]
          [[ "$(dpkg-deb --field "$package" Version)" == "$RELEASE_VERSION" ]]
          [[ "$(dpkg-deb --field "$package" Architecture)" == "$PACKAGE_ARCH" ]]
          [[ "$(dpkg --print-architecture)" == "$PACKAGE_ARCH" ]]
          [[ "$(stat -c %s "$package")" -le 67108864 ]]
          dpkg-deb --info "$package"
          dpkg-deb --extract "$package" "$RUNNER_TEMP/dayline-package"
          [[ -x "$RUNNER_TEMP/dayline-package/usr/bin/dayline" ]]
          [[ -x "$RUNNER_TEMP/dayline-package/usr/lib/dayline/dayline" ]]
          [[ -f "$RUNNER_TEMP/dayline-package/usr/share/applications/dayline.desktop" ]]
          [[ -f "$RUNNER_TEMP/dayline-package/usr/share/doc/dayline/copyright" ]]
          python3 - "$RUNNER_TEMP/dayline-package/usr/lib/dayline" <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          runtime = Path(sys.argv[1])
          libraries = runtime / "lib"
          providers = {}
          records = {}
          for path in sorted(runtime.rglob("*")):
              if not path.is_file():
                  continue
              with path.open("rb") as handle:
                  if handle.read(4) != b"\x7fELF":
                      continue
              dynamic = subprocess.check_output(["readelf", "--dynamic", "--wide", str(path)], text=True)
              needed = re.findall(r"\(NEEDED\).*?\[(.*?)\]", dynamic)
              if any("/" in name for name in needed):
                  raise SystemExit(f"Non-SONAME dependency: {path}")
              relative = os.path.relpath(libraries, path.parent)
              expected = "$ORIGIN" if relative == "." else "$ORIGIN/" + relative
              rpaths = re.findall(r"\(RPATH\).*?\[(.*?)\]", dynamic)
              if rpaths != [expected] or "(RUNPATH)" in dynamic:
                  raise SystemExit(f"Private runtime must use a relative DT_RPATH: {path}")
              versions = subprocess.check_output(["readelf", "--version-info", "--wide", str(path)], text=True)
              if "GLIBC_PRIVATE" in versions:
                  raise SystemExit(f"Private glibc ABI: {path}")
              for version in re.findall(r"\bGLIBC_(\d+(?:\.\d+)+)\b", versions):
                  if tuple(map(int, version.split("."))) > (2, 28):
                      raise SystemExit(f"glibc 2.28 baseline exceeded: {path}: GLIBC_{version}")
              definitions = set()
              requirements = {}
              section = None
              provider = None
              for line in versions.splitlines():
                  if line.startswith("Version definition section"):
                      section = "definitions"
                  elif line.startswith("Version needs section"):
                      section = "needs"
                  elif line.startswith("Version symbols section"):
                      section = None
                  if section == "needs":
                      match = re.search(r"\bFile:\s+(\S+)", line)
                      if match:
                          provider = match.group(1)
                  match = re.search(r"\bName:\s+(\S+)", line)
                  if match and section == "definitions":
                      definitions.add(match.group(1))
                  elif match and section == "needs":
                      requirements.setdefault(provider, set()).add(match.group(1))
              soname = re.search(r"\(SONAME\).*?\[(.*?)\]", dynamic)
              if soname:
                  name = soname.group(1)
                  if name in providers:
                      raise SystemExit(f"Duplicate private SONAME: {name}")
                  providers[name] = path
              records[path] = (definitions, requirements)
          for name in ("libQt6Core.so.6", "libstdc++.so.6", "libgcc_s.so.1", "libssl.so.3", "libcrypto.so.3", "libical.so.3"):
              if name not in providers:
                  raise SystemExit(f"Missing bundled runtime: {name}")
          if "Qt_6.4" not in records[providers["libQt6Core.so.6"]][0]:
              raise SystemExit("Bundled Qt does not provide the Qt 6.4 ABI")
          for path, (_, requirements) in records.items():
              for name, required in requirements.items():
                  if name in providers:
                      missing = required - records[providers[name]][0]
                      if missing:
                          raise SystemExit(f"Inconsistent private ABI: {path}: {name}: {sorted(missing)}")
          print(f"Verified {len(records)} private ELF files: glibc <= 2.28 and consistent bundled ABI providers")
          PY
          dependencies="$(dpkg-deb --field "$package" Depends)"
          sudo apt-get satisfy --no-install-recommends -y "$dependencies"
          mkdir -p "$RUNNER_TEMP/dayline-runtime"
          chmod 700 "$RUNNER_TEMP/dayline-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/dayline-runtime"
          actual_version="$(QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/dayline-package/usr/bin/dayline" --version)"
          [[ "$actual_version" == "Dayline $RELEASE_VERSION" ]]
          mkdir -p artifacts
          mv "$package" artifacts/

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: dayline-linux-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Remove the disposable build container
        if: always()
        run: |
          if docker container inspect "$DAYLINE_BUILD_CONTAINER" > /dev/null 2>&1; then
            docker container rm --force "$DAYLINE_BUILD_CONTAINER"
          fi

  release:
    name: Publish the verified packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both native builds
        uses: actions/download-artifact@v4
        with:
          pattern: dayline-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums and identify the source version
        run: |
          [[ "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2 ]]
          for arch in amd64 arm64; do
            package="dist/dayline_${RELEASE_VERSION}_${arch}.deb"
            [[ -f "$package" ]]
            [[ "$(dpkg-deb --field "$package" Version)" == "$RELEASE_VERSION" ]]
            [[ "$(dpkg-deb --field "$package" Architecture)" == "$arch" ]]
          done
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - name: Publish the exact source commit without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker="dayline-action-run:${GITHUB_RUN_ID}"
          releases="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --slurp)"
          existing="$(jq -r --arg marker "$marker" --arg tag "$RELEASE_TAG" \
            '.[][] | select(.tag_name == $tag or ((.body // "") | contains($marker))) | .tag_name' \
            <<< "$releases")"
          [[ -z "$existing" ]] || {
            echo "::error::A Release or draft already exists for this run or version: ${existing}. Inspect it before retrying; assets will not be replaced."
            exit 1
          }
          tags="$(gh api --paginate "repos/${GH_REPO}/tags?per_page=100" --jq '.[].name')"
          if grep -Fxq "$RELEASE_TAG" <<< "$tags"; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Inspect it before retrying."
            exit 1
          fi

          cat > "$RUNNER_TEMP/dayline-release-notes.md" <<EOF
          日笺 Dayline ${RELEASE_VERSION} · Linux 桌面日历预览版

          提供本机日程、桌面月历与 iCloud CalDAV 账户接入和同步界面。

          安装包分别在 amd64 和 ARM64 原生运行器的 Rocky Linux 8 容器中构建，以 glibc 2.28 为最低基线。
          随包提供私有 Qt 6.4.3、OpenSSL、libical 和 C++ 运行库；系统包管理器只需补齐 X11、字体、图形驱动接口等系统依赖，不要求手动安装 Qt。

          下载与你的系统架构对应的 .deb，双击后使用系统安装器安装，或在下载目录执行：

          \`sudo apt install ./dayline_${RELEASE_VERSION}_amd64.deb\`

          ARM64 将文件名末尾的 amd64 换为 arm64。安装后在应用菜单打开“日笺”，或执行 \`dayline\`；\`dayline --desktop\` 启动桌面模式。
          启动入口固定为 \`/usr/bin/dayline\`，程序与私有运行库位于 \`/usr/lib/dayline\`；安装更高版本的同名软件包即可原位升级。

          桌面模式依赖桌面环境。GNOME Wayland 需要用户启用安装包附带的 Dayline Desktop Bridge 扩展（GNOME Shell 46），其他会话须确认 X11/EWMH 支持。
          本次以统信 UOS 20 ARM64 为兼容目标，尚未在对应华为麒麟电脑上实机验证。CI 完成原生构建、全部私有 ELF 的 glibc 基线与 ABI 核对，以及离屏启动检查；这些不能替代 UOS 20 的安装与桌面交互验证。
          iCloud 同步需 Apple App 专用密码，凭据在本机加密保存；尚未使用真实 Apple 账户验证跨设备往返。
          重复日程、会议邀请及当前不支持的结构保留原文并按只读处理；暂未提供新建重复日程与本机提醒。

          下载 SHA256SUMS 后校验对应安装包：\`sha256sum -c --ignore-missing SHA256SUMS\`。
          源码和安装包版本一致，构建提交：${GITHUB_SHA}。

          <!-- ${marker} -->
          EOF

          # Reserve the tag atomically. A rerun must stop rather than create
          # another draft when a previous publication only partly completed.
          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" --silent
          draft="$(gh api --method POST "repos/${GH_REPO}/releases" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Dayline ${RELEASE_VERSION}" -F draft=true -f make_latest=false \
            -F "body=@${RUNNER_TEMP}/dayline-release-notes.md")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" --arg marker "$marker" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha and
             ((.body // "") | contains($marker))' <<< "$draft" > /dev/null
          release_id="$(jq -r '.id' <<< "$draft")"
          upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' <<< "$draft")"
          [[ "$upload_url" == "https://uploads.github.com/repos/${GH_REPO}/releases/${release_id}/assets" ]]
          for asset in dist/*.deb dist/SHA256SUMS; do
            name="$(basename "$asset")"
            gh api --method POST "${upload_url}?name=${name}" \
              --header 'Content-Type: application/octet-stream' --input "$asset" --silent
          done
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == true and (.assets | length) == 3' \
            <<< "$release_json" > /dev/null
          for asset in dist/*.deb dist/SHA256SUMS; do
            name="$(basename "$asset")"
            size="$(stat -c %s "$asset")"
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            jq -e --arg name "$name" --argjson size "$size" --arg digest "$digest" \
              '.assets | any(.[]; .name == $name and .size == $size and .digest == $digest)' \
              <<< "$release_json" > /dev/null
          done

          # GitHub selects the latest semantic version, so a slower older build
          # finishing after a newer push cannot become the latest download.
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false -f make_latest=legacy > /dev/null
          published="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          jq -e '.draft == false and .prerelease == false and (.assets | length) == 3' \
            <<< "$published" > /dev/null
          commit="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha')"
          [[ "$commit" == "$GITHUB_SHA" ]] || {
            echo '::error::The published tag does not point to the built source commit.'
            exit 1
          }
